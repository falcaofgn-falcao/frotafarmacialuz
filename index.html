<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#b91c1c">
<title>FROTA LUZ - Farmácia Luz</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23dc2626'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='16' font-weight='bold' font-family='sans-serif'>FL</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#dc2626;--red-dark:#b91c1c;--red-light:#fee2e2;--red-50:#fef2f2;--bg:#fefefe;--bg2:#f8f8f8;--bg3:#f1f1f1;--border:#e5e5e5;--text:#1a1a1a;--text2:#525252;--text3:#737373;--text4:#a3a3a3;--white:#fff;--shadow:0 1px 3px rgba(0,0,0,.08);--shadow2:0 4px 12px rgba(0,0,0,.08);--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:var(--bg2);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit}
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:transform .25s ease}
.sidebar.closed{transform:translateX(-100%)}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:90;display:none}.sidebar-overlay.show{display:block}
.main{flex:1;margin-left:240px;min-width:0}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.sidebar-header img{width:100%;max-width:180px;height:auto}
.sidebar-nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border:none;background:transparent;border-radius:10px;color:var(--text2);font-size:13px;font-weight:500;transition:all .15s}
.nav-btn:hover{background:var(--red-50);color:var(--red)}
.nav-btn.active{background:var(--red);color:white;font-weight:700}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;flex-shrink:0}
.sidebar-footer{padding:8px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.btn-foot{width:100%;padding:5px 6px;border:1px solid var(--border);background:transparent;border-radius:6px;color:var(--text4);font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px}
.btn-foot svg{width:12px;height:12px}
.btn-foot:hover{border-color:var(--red);color:var(--red)}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.topbar h2{font-size:17px;font-weight:700}
.menu-btn{background:none;border:none;color:var(--text2);width:28px;height:28px;display:none;padding:0}
@media(max-width:768px){.menu-btn{display:flex;align-items:center;justify-content:center}}
.topbar-icon{width:22px;height:22px;color:var(--red)}
.sync-badge{margin-left:auto;font-size:10px;padding:3px 8px;border-radius:6px;font-weight:600;display:flex;align-items:center;gap:4px}
.sync-ok{background:#dcfce7;color:#16a34a}.sync-saving{background:#fef3c7;color:#d97706}.sync-err{background:var(--red-light);color:var(--red)}.sync-loading{background:#dbeafe;color:#2563eb}
.content{padding:20px;max-width:960px;margin:0 auto}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.kpi-card{background:var(--white);border-radius:var(--radius);padding:18px;border:1px solid var(--border);position:relative;overflow:hidden;box-shadow:var(--shadow)}
.kpi-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;border-radius:var(--radius) 0 0 var(--radius)}
.kpi-card.red::before{background:var(--red)}.kpi-card.amber::before{background:#f59e0b}.kpi-card.purple::before{background:#8b5cf6}.kpi-card.green::before{background:#16a34a}
.kpi-label{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi-value{font-size:24px;font-weight:800;line-height:1.1;margin-bottom:4px}
.kpi-value.red{color:var(--red)}.kpi-value.amber{color:#f59e0b}.kpi-value.purple{color:#8b5cf6}.kpi-value.green{color:#16a34a}
.kpi-sub{font-size:11px;color:var(--text4)}
.section{background:var(--white);border-radius:var(--radius);padding:20px;border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:16px}
.section-title{font-size:15px;font-weight:700;margin-bottom:16px}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bg3);flex-wrap:wrap}.list-item:last-child{border-bottom:none}
.list-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.list-icon svg{width:20px;height:20px}
.list-icon.red{background:var(--red-light);color:var(--red)}.list-icon.amber{background:#fef3c7;color:#f59e0b}.list-icon.purple{background:#ede9fe;color:#8b5cf6}.list-icon.green{background:#dcfce7;color:#16a34a}
.list-body{flex:1;min-width:120px}.list-body h4{font-size:14px;font-weight:600}.list-body p{font-size:11px;color:var(--text3);margin-top:2px}
.list-value{font-size:16px;font-weight:700;text-align:right}
.list-value.red{color:var(--red)}.list-value.amber{color:#f59e0b}.list-value.purple{color:#8b5cf6}
.btn{padding:10px 18px;border:none;border-radius:10px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--red);color:white}.btn-primary:hover{background:var(--red-dark)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text3)}.btn-ghost:hover{border-color:var(--red);color:var(--red)}
.btn-icon{padding:6px;border-radius:8px;background:none;border:none;color:var(--text4);width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.btn-icon:hover{background:var(--bg3);color:var(--red)}.btn-icon svg{width:16px;height:16px}
.actions-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.actions-bar span{font-size:13px;color:var(--text3)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--white);border-radius:16px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow2)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 0}
.modal-header h3{font-size:18px;font-weight:700}
.modal-body{padding:16px 24px 24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--text3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select{width:100%;padding:10px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;transition:border .15s}
.field input:focus,.field select:focus{border-color:var(--red)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:10px;margin-top:6px}
.bar-chart{display:flex;align-items:flex-end;gap:8px;padding:0 4px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar-col .val{font-size:10px;color:var(--text3);font-weight:600}
.bar-col .bar{width:100%;max-width:52px;border-radius:6px 6px 2px 2px;transition:height .5s;min-height:4px}
.bar-col .lbl{font-size:10px;color:var(--text4);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px;text-align:center}
.progress-bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:3px;transition:width .5s}
.rank-num{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
.rank-1{background:var(--red);color:white}.rank-2{background:var(--bg3);color:var(--text2)}.rank-3{background:var(--bg3);color:var(--text3)}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.detail-card{background:var(--bg2);border-radius:10px;padding:10px 12px}
.detail-card .dl{font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;margin-bottom:3px}
.detail-card .dv{font-size:15px;font-weight:700}
.loading-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg2)}
.loading-screen img{width:140px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.animate-in{animation:fadeIn .3s ease both}
@media print{.sidebar,.topbar,.menu-btn,.btn,.btn-icon,.actions-bar button{display:none!important}.main{margin-left:0!important}}
</style>
</head>

// Calcula eficiência km/L por motoboy usando quilometragem + abastecimentos
function calcEficiencia(mes){
  const kms=(data.quilometragem||[]).filter(k=>!mes||k.data?.startsWith(mes));
  const abs=data.abastecimentos.filter(a=>!mes||a.data?.startsWith(mes));
  
  // Primeiro calcula km/L médio dos motoboys COM hodômetro funcionando
  const mbsOk=data.motoboys.filter(m=>!m.kmDefeito&&m.status!=="inativo");
  let somaKmlOk=0,countOk=0;
  mbsOk.forEach(mb=>{
    const mKms=kms.filter(k=>k.motoboyId===mb.id&&k.kmFin>k.kmIni);
    const mAbs=abs.filter(a=>a.motoboyId===mb.id);
    const tk=mKms.reduce((s,k)=>s+(k.kmFin-k.kmIni),0);
    const tl=mAbs.reduce((s,a)=>s+a.litros,0);
    if(tl>0&&tk>0){somaKmlOk+=tk/tl;countOk++}
  });
  const avgKmlEquipe=countOk>0?somaKmlOk/countOk:META_KML;

  return data.motoboys.map(mb=>{
    const mKms=kms.filter(k=>k.motoboyId===mb.id&&k.kmFin>k.kmIni);
    const mAbs=abs.filter(a=>a.motoboyId===mb.id);
    const totalKmReal=mKms.reduce((s,k)=>s+(k.kmFin-k.kmIni),0);
    const totalLit=mAbs.reduce((s,a)=>s+a.litros,0);
    
    // Se hodômetro com defeito, estima km pela média da equipe
    const kmEstimado=mb.kmDefeito&&totalLit>0;
    const totalKm=kmEstimado?Math.round(totalLit*avgKmlEquipe):totalKmReal;
    
    const kml=totalLit>0?totalKm/totalLit:0;
    const metaKm=totalLit*META_KML;
    const diff=totalKm-metaKm;
    const ultimoAb=mAbs.sort((a,b)=>b.data.localeCompare(a.data))[0];
    return{...mb,totalKm,totalKmReal,totalLit,kml,metaKm,diff,kmEstimado,avgKmlEquipe,ok:kml>=META_KML*0.85||totalLit===0,ultimoAb};
  });
}

function calcKpis(mes){
  const fM=arr=>mes?arr.filter(r=>r.data?.startsWith(mes)):arr;
  const ab=fM(data.abastecimentos);
  const mn=fM(data.manutencoes);
  const en=fM(data.entregas);

  const tComb=ab.reduce((s,a)=>s+a.valor,0);
  const tManut=mn.reduce((s,m)=>s+m.valor,0);
  const tGeral=tComb+tManut;
  const tEnt=en.reduce((s,e)=>s+e.qtd,0);
  const tLit=ab.reduce((s,a)=>s+a.litros,0);

  const mbsOk=data.motoboys.filter(m=>!m.kmDefeito);
  const kmOk=mbsOk.reduce((s,mb)=>s+en.filter(e=>e.motoboyId===mb.id).reduce((s2,e)=>s2+e.km,0),0);
  const entOk=mbsOk.reduce((s,mb)=>s+en.filter(e=>e.motoboyId===mb.id).reduce((s2,e)=>s2+e.qtd,0),0);
  const avgKmPorEnt=entOk>0?kmOk/entOk:2.5;

  const porMb=data.motoboys.filter(mb=>mb.status!=="inativo").map(mb=>{
    const comb=ab.filter(a=>a.motoboyId===mb.id).reduce((s,a)=>s+a.valor,0);
    const manut=mn.filter(m=>m.motoboyId===mb.id).reduce((s,m)=>s+m.valor,0);
    const ent2=en.filter(e=>e.motoboyId===mb.id).reduce((s,e)=>s+e.qtd,0);
    const kmReal=en.filter(e=>e.motoboyId===mb.id).reduce((s,e)=>s+e.km,0);
    const lit=ab.filter(a=>a.motoboyId===mb.id).reduce((s,a)=>s+a.litros,0);
    const total=comb+manut;
    const kmEstimado=mb.kmDefeito;
    const km=kmEstimado?Math.round(ent2*avgKmPorEnt):kmReal;
    return{...mb,comb,manut,total,ent:ent2,km,kmReal,kmEstimado,lit,custoEnt:ent2>0?total/ent2:0,custoKm:km>0?total/km:0,consumo:lit>0?km/lit:0};
  });

  const tKm=porMb.reduce((s,m)=>s+m.km,0);
  return{tComb,tManut,tGeral,tEnt,tKm,tLit,custoEnt:tEnt>0?tGeral/tEnt:0,custoKm:tKm>0?tGeral/tKm:0,consumo:tLit>0?tKm/tLit:0,porMb,avgKmPorEnt};
}

// Alertas de manutenção preventiva
function getAlertasManut(){
  const alertas=[];
  data.motoboys.forEach(mb=>{
    // KM atual = maior kmFin da quilometragem
    const kms=(data.quilometragem||[]).filter(k=>k.motoboyId===mb.id&&k.kmFin>0);
    const kmAtual=kms.length>0?Math.max(...kms.map(k=>k.kmFin)):0;
    // Próxima revisão = maior kmProxRevisao das manutenções
    const manuts=data.manutencoes.filter(m=>m.motoboyId===mb.id&&m.kmProxRevisao>0);
    if(manuts.length===0||kmAtual===0)return;
    const proxRev=Math.max(...manuts.map(m=>m.kmProxRevisao));
    const falta=proxRev-kmAtual;
    if(falta<=500){alertas.push({mb,kmAtual,proxRev,falta,vencida:falta<=0})}
  });
  return alertas;
}
function renderAlertasManut(){
  const al=getAlertasManut();
  if(al.length===0)return'';
  return'<div class="section animate-in" style="border-color:#fde68a;background:#fffbeb"><div class="section-title" style="color:#92400e">🔔 Alertas de Manutenção</div>'+al.map(a=>{
    const cor=a.vencida?'var(--red)':'#d97706';
    const msg=a.vencida?'⚠ REVISÃO VENCIDA ('+fN(Math.abs(a.falta),0)+'km acima)':'⏰ Faltam '+fN(a.falta,0)+'km para revisão';
    return'<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #fde68a"><div style="font-size:13px;font-weight:700;flex:1;color:'+cor+'">'+esc(a.mb.nome)+'</div><div style="text-align:right"><div style="font-size:12px;font-weight:700;color:'+cor+'">'+msg+'</div><div style="font-size:10px;color:var(--text4)">Atual: '+fN(a.kmAtual,0)+'km · Próx: '+fN(a.proxRev,0)+'km</div></div></div>';
  }).join("")+'</div>';
}

    const kmDef=document.getElementById("f_kmDefeito");
    const inativo=document.getElementById("f_inativo");
    const obj={nome,telefone:gv("f_tel"),cnh:gv("f_cnh"),moto:gv("f_moto"),placa:gv("f_placa"),kmDefeito:kmDef?kmDef.checked:false,status:inativo&&inativo.checked?"inativo":"ativo"};
    if(_editId){const r=data.motoboys.find(m=>m.id===_editId);if(r)Object.assign(r,obj)}
    else{data.motoboys.push({id:"mb"+uid(),status:"ativo",...obj})}
  }else if(_editType==="abast"){
    const mb=gv("f_mb"),litros=gn("f_litros"),valor=gn("f_valor");
    if(!mb||!litros||!valor)return alert("Preencha motoboy, litros e valor");
    const postoSel=gv("f_posto_sel");
    const posto=postoSel==="__outro"?gv("f_posto_outro").trim():postoSel;
    if(!posto)return alert("Selecione ou digite o posto");
    // Salva novo posto na lista
    if(!data.postos)data.postos=[];
    if(posto&&data.postos.indexOf(posto)===-1){data.postos.push(posto)}
    const motoUsada=gv("f_motoUsada")||"propria";
    const obj={motoboyId:mb,data:gv("f_data"),litros,valor,posto,motoUsada,obs:gv("f_obs")};
    if(_editId){const r=data.abastecimentos.find(a=>a.id===_editId);if(r)Object.assign(r,obj)}
    else{data.abastecimentos.push({id:"ab"+uid(),...obj})}
  }else if(_editType==="km"){
    const mb=gv("f_mb"),kmIni=gn("f_kmIni"),kmFin=gn("f_kmFin");
    if(!mb)return alert("Selecione o motoboy");
    if(!kmIni&&!kmFin)return alert("Preencha KM Inicial ou Final");
    if(!data.quilometragem)data.quilometragem=[];
    const obj={motoboyId:mb,data:gv("f_data"),kmIni,kmFin,motoUsada:gv("f_motoKm")||"propria",obs:gv("f_obs")};
    if(_editId){const r=data.quilometragem.find(k=>k.id===_editId);if(r)Object.assign(r,obj)}
    else{data.quilometragem.push({id:"km"+uid(),...obj})}
  }else if(_editType==="manut"){
    const mb=gv("f_mb"),valor=gn("f_valor");
    if(!mb||!valor)return alert("Preencha motoboy e valor");
    const obj={motoboyId:mb,data:gv("f_data"),tipo:gv("f_tipo"),valor,descricao:gv("f_desc"),local:gv("f_local"),obs:gv("f_obs")};
    if(_editId){const r=data.manutencoes.find(m=>m.id===_editId);if(r)Object.assign(r,obj)}
    else{data.manutencoes.push({id:"mn"+uid(),...obj})}
  }else if(_editType==="entrega"){
    const mb=gv("f_mb"),qtd=parseInt(gv("f_qtd"))||0;
    if(!mb||!qtd)return alert("Preencha motoboy e quantidade");
    const obj={motoboyId:mb,data:gv("f_data"),dataFim:gv("f_dataFim")||gv("f_data"),qtd,km:0,obs:gv("f_obs")};
    if(_editId){const r=data.entregas.find(e=>e.id===_editId);if(r)Object.assign(r,obj)}
    else{data.entregas.push({id:"en"+uid(),...obj})}
  }
  // Captura dados do alerta ANTES de salvar (saveData reconstrói o DOM)
  var _alertMb=(_editType==="abast"||_editType==="km")?gv("f_mb"):null;
  var _alertType=_editType;
  
  await saveData();
  
  // ALERTA ao abastecer — mostra km que falta rodar do abastecimento anterior
  if(_alertType==="abast"&&_alertMb){
    var mbNome2=mbName(_alertMb);
    // Pega os 2 últimos abastecimentos deste motoboy (o atual + o anterior)
    var absOrden=data.abastecimentos.filter(function(a){return a.motoboyId===_alertMb}).sort(function(a,b){return b.data.localeCompare(a.data)});
    if(absOrden.length>=2){
      var abAnterior=absOrden[1]; // penúltimo abastecimento
      var litAnt=abAnterior.litros;
      var metaKmAnt=litAnt*META_KML;
      // KM rodados entre o abastecimento anterior e agora
      var kmsEntre=(data.quilometragem||[]).filter(function(k){return k.motoboyId===_alertMb&&k.data>=abAnterior.data&&k.kmFin>k.kmIni});
      var kmRodado=kmsEntre.reduce(function(s,k){return s+(k.kmFin-k.kmIni)},0);
      var faltaKm2=Math.max(0,metaKmAnt-kmRodado);
      if(faltaKm2>0){
        showToast("⚠ "+mbNome2+": No abastecimento anterior ("+fmtDt(abAnterior.data)+") colocou "+fN(litAnt,1)+"L. Deveria rodar "+fN(metaKmAnt,0)+"km, rodou "+fN(kmRodado,0)+"km. FALTAM "+fN(faltaKm2,0)+"km!",10000);
      }else{
        showToast("✅ "+mbNome2+": Abastecimento anterior ("+fN(litAnt,1)+"L) — rodou "+fN(kmRodado,0)+"km de "+fN(metaKmAnt,0)+"km necessários. META OK!",8000);
      }
    }else if(absOrden.length===1){
      var litNovo=absOrden[0].litros;
      var metaNovo=litNovo*META_KML;
      showToast("🎯 "+mbNome2+": Primeiro abastecimento registrado ("+fN(litNovo,1)+"L). Precisa rodar "+fN(metaNovo,0)+"km para atingir "+META_KML+"km/L.",8000);
    }
  }
  
  // ALERTA ao lançar KM — mostra quanto falta do abastecimento atual
  if(_alertType==="km"&&_alertMb){
    var mbNome3=mbName(_alertMb);
    var ultimoAb=data.abastecimentos.filter(function(a){return a.motoboyId===_alertMb}).sort(function(a,b){return b.data.localeCompare(a.data)})[0];
    if(ultimoAb){
      var litUlt=ultimoAb.litros;
      var metaUlt=litUlt*META_KML;
      var kmsDesde=(data.quilometragem||[]).filter(function(k){return k.motoboyId===_alertMb&&k.data>=ultimoAb.data&&k.kmFin>k.kmIni});
      var kmDesde=kmsDesde.reduce(function(s,k){return s+(k.kmFin-k.kmIni)},0);
      var faltaUlt=Math.max(0,metaUlt-kmDesde);
      if(faltaUlt>0){
        showToast("🎯 "+mbNome3+": Último abastecimento "+fN(litUlt,1)+"L ("+fmtDt(ultimoAb.data)+"). Rodou "+fN(kmDesde,0)+"km de "+fN(metaUlt,0)+"km. FALTAM "+fN(faltaUlt,0)+"km.",10000);
      }else{
        showToast("✅ "+mbNome3+": Rodou "+fN(kmDesde,0)+"km com "+fN(litUlt,1)+"L — META DE "+META_KML+"km/L ATINGIDA!",8000);
      }
    }
  }
  
  closeModal();
}

function renderEficiencia(mes){

    var ant=efAnt.find(function(a){return a.id===e.id})||{totalKm:0,totalLit:0,kml:0};
    var cor=e.totalLit===0?"var(--text4)":e.kml>=META_KML?"#16a34a":e.kml>=META_KML*0.85?"#d97706":"var(--red)";
    var bg=e.totalLit===0?"var(--bg3)":e.kml>=META_KML?"#dcfce7":e.kml>=META_KML*0.85?"#fef3c7":"#fee2e2";

    var estBadge=e.kmEstimado?' <span style="background:#fef3c7;color:#92400e;font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700">⚙ KM estimado</span>':'';
    var falta=e.totalLit>0?Math.max(0,e.metaKm-e.totalKm):0;
    var mesAntTag=ant.totalLit>0?'<div style="background:var(--bg2);border-radius:6px;padding:8px;margin-top:8px;font-size:11px;color:var(--text3)">📅 <strong>Mês anterior:</strong> '+fN(ant.totalKm,0)+' km · '+fN(ant.totalLit,1)+'L · <strong style="color:'+(ant.kml>=META_KML?"#16a34a":"#d97706")+'">'+fN(ant.kml,1)+' km/L</strong></div>':'';

  const ant=kAnt.porMb.find(a=>a.id===mb.id)||{comb:0,ent:0,lit:0,total:0,custoEnt:0};
  const estTag=mb.kmEstimado?' <span style="background:#fef3c7;color:#92400e;font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700">⚙ estimado</span>':'';
  const d=[{l:"Combustível",v:fmt(mb.comb),c:"#f59e0b"},{l:"Manutenção",v:fmt(mb.manut),c:"#8b5cf6"},{l:"Entregas",v:mb.ent,c:"#16a34a"},{l:"KM Rodados",v:fN(mb.km,0)+(mb.kmEstimado?' (est.)':''),c:"#2563eb"},{l:"Custo/Entrega",v:fmt(mb.custoEnt),c:"var(--red)"},{l:"Custo/KM",v:fmt(mb.custoKm)+(mb.kmEstimado?' (est.)':''),c:"#a855f7"},{l:"Consumo km/L",v:fN(mb.consumo)+(mb.kmEstimado?' (est.)':''),c:"#059669"},{l:"Litros Total",v:fN(mb.lit),c:"#d97706"}];

  // Análise inteligente
  const litPorEnt=mb.ent>0?mb.lit/mb.ent:0;
  const pontos=[];const melhorias=[];

  // Eficiência km/L (dados de quilometragem)
  const ef=calcEficiencia(selMes).find(e=>e.id===mb.id)||{totalKm:0,totalLit:0,kml:0,metaKm:0,diff:0};
  const efOk=ef.totalLit>0&&ef.kml>=META_KML;
  const efQuase=ef.totalLit>0&&ef.kml>=META_KML*0.85;
  const efBadge=ef.totalLit===0?'Sem dados km/L':efOk?'✓ Meta atingida':efQuase?'⚠ Quase na meta':'⚠ Abaixo da meta';
  const efCor=ef.totalLit===0?'var(--text4)':efOk?'#16a34a':efQuase?'#d97706':'var(--red)';
  const efBg=ef.totalLit===0?'var(--bg3)':efOk?'#dcfce7':efQuase?'#fef3c7':'#fee2e2';
  const faltaKm=ef.totalLit>0?Math.max(0,ef.metaKm-ef.totalKm):0;

  const efCard='<div style="margin-top:12px;border:1px solid '+efCor+'33;border-radius:10px;padding:14px;background:'+efBg+'22"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="font-size:13px;font-weight:700;color:'+efCor+'">🎯 Eficiência km/L <span style="background:'+efBg+';color:'+efCor+';font-size:10px;padding:2px 8px;border-radius:4px;font-weight:700;margin-left:6px">'+efBadge+'</span></div><div style="font-size:20px;font-weight:800;color:'+efCor+'">'+fN(ef.kml,1)+' km/L</div></div><div class="detail-grid"><div class="detail-card"><div class="dl">KM Rodados</div><div class="dv" style="color:#2563eb">'+fN(ef.totalKm,0)+'</div></div><div class="detail-card"><div class="dl">Litros</div><div class="dv" style="color:#f59e0b">'+fN(ef.totalLit,1)+'L</div></div><div class="detail-card"><div class="dl">km/L Real</div><div class="dv" style="color:'+efCor+'">'+fN(ef.kml,1)+'</div></div><div class="detail-card"><div class="dl">Falta p/ meta</div><div class="dv" style="color:'+(faltaKm>0?'var(--red)':'#16a34a')+'">'+(faltaKm>0?fN(faltaKm,0)+' km':'0 km ✓')+'</div></div></div>'
  +(ef.totalLit>0&&!efOk&&!efQuase?'<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:8px;margin-top:8px;font-size:11px;color:#991b1b">⚠ Rodou '+fN(ef.totalKm,0)+'km com '+fN(ef.totalLit,1)+'L — deveria ter rodado '+fN(ef.metaKm,0)+'km ('+META_KML+'km/L). <strong>Faltaram '+fN(faltaKm,0)+'km.</strong> Verificar: condução, pneus, moto precisa de revisão?</div>':'')
  +(ef.totalLit>0&&efOk?'<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;padding:8px;margin-top:8px;font-size:11px;color:#166534">✅ Bom desempenho! Rodou '+fN(ef.totalKm,0)+'km com '+fN(ef.totalLit,1)+'L — atingiu a meta de '+META_KML+'km/L. Continue assim!</div>':'')
  +'</div>';

  // Análise de entregas
  if(mb.ent===0){melhorias.push({ico:"📦",txt:"Sem entregas registradas neste mês. Verificar se os lançamentos estão sendo feitos.",tip:"Orientar a registrar entregas diariamente no sistema."})
  }else if(mb.ent>=avgEntregas*1.1){pontos.push({ico:"🏆",txt:"Volume de entregas acima da média da equipe ("+mb.ent+" vs média "+fN(avgEntregas,0)+"). Bom desempenho!"})
  }else if(mb.ent<avgEntregas*0.8&&avgEntregas>0){melhorias.push({ico:"📦",txt:"Volume de entregas abaixo da média ("+mb.ent+" vs média "+fN(avgEntregas,0)+").",tip:"Avaliar se a rota pode ser otimizada ou se há tempo ocioso."})}

  // Análise km/L vs meta
  if(ef.totalLit>0&&ef.kml<META_KML*0.85){melhorias.push({ico:"🎯",txt:"Média de "+fN(ef.kml,1)+" km/L está abaixo da meta de "+META_KML+" km/L.",tip:"Verificar calibragem dos pneus, condução econômica, e estado geral da moto."})}
  else if(ef.totalLit>0&&ef.kml>=META_KML){pontos.push({ico:"🎯",txt:"Média de "+fN(ef.kml,1)+" km/L atinge a meta de "+META_KML+" km/L. Excelente economia de combustível!"})}

  // Análise de combustível
  if(mb.comb>0&&litPorEnt>avgLitPorEnt*1.15&&avgLitPorEnt>0){melhorias.push({ico:"⛽",txt:"Consumo de "+fN(litPorEnt,2)+" L/entrega está acima da média ("+fN(avgLitPorEnt,2)+" L/ent).",tip:"Verificar condução, calibragem dos pneus, e se a moto precisa de revisão."})
  }else if(mb.comb>0&&litPorEnt<=avgLitPorEnt&&litPorEnt>0){pontos.push({ico:"⛽",txt:"Eficiência de combustível boa: "+fN(litPorEnt,2)+" L/entrega (média "+fN(avgLitPorEnt,2)+"). Parabéns pela economia!"})}

  // Análise de custo
  if(mb.custoEnt>avgCustoEnt*1.2&&avgCustoEnt>0&&mb.ent>0){melhorias.push({ico:"💰",txt:"Custo por entrega de "+fmt(mb.custoEnt)+" está 20%+ acima da média ("+fmt(avgCustoEnt)+").",tip:"Focar em reduzir abastecimentos desnecessários e manter a moto em dia."})
  }else if(mb.custoEnt<=avgCustoEnt&&mb.custoEnt>0){pontos.push({ico:"💰",txt:"Custo por entrega de "+fmt(mb.custoEnt)+" está dentro ou abaixo da média. Ótimo controle de gastos!"})}

  // Análise de evolução vs mês anterior
  if(ant.ent>0&&mb.ent>0){
    if(mb.custoEnt<ant.custoEnt*0.9){pontos.push({ico:"📈",txt:"Custo/entrega melhorou em relação ao mês anterior (de "+fmt(ant.custoEnt)+" para "+fmt(mb.custoEnt)+"). Continue assim!"})}
    if(mb.custoEnt>ant.custoEnt*1.15){melhorias.push({ico:"📉",txt:"Custo/entrega piorou vs mês anterior (de "+fmt(ant.custoEnt)+" para "+fmt(mb.custoEnt)+").",tip:"Comparar o que mudou: mais abastecimentos? Preço do combustível subiu? Manutenção extra?"})}
    if(mb.ent>ant.ent*1.1){pontos.push({ico:"📈",txt:"Entregas aumentaram de "+ant.ent+" para "+mb.ent+" vs mês anterior. Boa produtividade!"})}
  }

  // Nota geral
  const totalPontos=pontos.length;const totalMelhorias=melhorias.length;
  let nota,notaCor,notaBg;
  if(mb.ent===0){nota="⏳ Sem dados";notaCor="#92400e";notaBg="#fef3c7"}
  else if(totalMelhorias===0){nota="⭐ Excelente";notaCor="#16a34a";notaBg="#dcfce7"}
  else if(totalPontos>=totalMelhorias){nota="👍 Bom";notaCor="#2563eb";notaBg="#dbeafe"}
  else{nota="⚠ Atenção";notaCor="#d97706";notaBg="#fef3c7"}

  let feedbackHtml='<div style="margin-top:14px">';
  if(pontos.length>0){feedbackHtml+='<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px;margin-bottom:8px">'+pontos.map(p=>'<div style="display:flex;gap:8px;padding:4px 0;font-size:12px;color:#166534"><span>'+p.ico+'</span><span>'+esc(p.txt)+'</span></div>').join("")+'</div>'}
  if(melhorias.length>0){feedbackHtml+='<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:12px">'+melhorias.map(m=>'<div style="padding:4px 0;font-size:12px;color:#991b1b"><div style="display:flex;gap:8px"><span>'+m.ico+'</span><span style="font-weight:600">'+esc(m.txt)+'</span></div>'+(m.tip?'<div style="margin-left:24px;color:#b91c1c;font-style:italic;font-size:11px;margin-top:2px">💡 '+esc(m.tip)+'</div>':'')+'</div>').join("")+'</div>'}
  feedbackHtml+='</div>';

  return'<div class="section animate-in"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px"><div><div style="font-size:16px;font-weight:700">'+esc(mb.nome)+estTag+' <span style="background:'+notaBg+';color:'+notaCor+';font-size:11px;padding:3px 8px;border-radius:6px;font-weight:700;margin-left:6px">'+nota+'</span></div><div style="font-size:12px;color:var(--text3)">'+esc(mb.moto)+' · '+esc(mb.placa)+'</div></div><div style="font-size:22px;font-weight:800;color:var(--red)">'+fmt(mb.total)+'</div></div><div class="detail-grid">'+d.map(x=>'<div class="detail-card"><div class="dl">'+x.l+'</div><div class="dv" style="color:'+x.c+'">'+x.v+'</div></div>').join("")+'</div>'+efCard+feedbackHtml+'</div>';
}).join("");

return'<div class="actions-bar"><span style="font-size:15px;font-weight:700">Relatório por Motoboy</span><div style="display:flex;gap:8px"><select onchange="setDashMes(this.value)" style="padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px;background:var(--white);color:var(--red);font-weight:700">'+mesOpts+'</select><button class="btn btn-ghost" onclick="window.print()" style="font-size:12px">🖨️</button></div></div>'+resumo+c}

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
function renderTopbar(){
  const el=document.getElementById("sync-badge");if(!el)return;
  const map={loading:['sync-badge sync-loading','⟳ Carregando...'],ok:['sync-badge sync-ok','● Sincronizado'],saving:['sync-badge sync-saving','⟳ Salvando...'],error:['sync-badge sync-err','✕ Erro de conexão']};
  const[cls,txt]=map[syncStatus]||map.error;
  el.className=cls;el.textContent=txt;
}

function render(){
  if(!data){document.getElementById("app").innerHTML='<div class="loading-screen"><img src="'+LOGO+'" alt="Farmácia Luz"><div class="spinner"></div><div style="color:var(--text3);font-size:14px">Conectando ao servidor...</div></div><div id="toast"></div>';return}
  const cur=NAV.find(n=>n.key===page)||NAV[0];
  const pgs={dashboard:renderDashboard,motoboys:renderMotoboys,quilometragem:renderQuilometragem,abastecimentos:renderAbastecimentos,manutencoes:renderManutencoes,entregas:renderEntregas,relatorios:renderRelatorios};
  const pc=(pgs[page]||renderDashboard)();
  const isMob=window.innerWidth<=768;
  const sCls=isMob?(sideOpen?"sidebar open":"sidebar closed"):"sidebar";
  const ov=sideOpen&&isMob?'<div class="sidebar-overlay show" onclick="toggleSide()"></div>':"";
  const stMap={loading:'sync-badge sync-loading',ok:'sync-badge sync-ok',saving:'sync-badge sync-saving',error:'sync-badge sync-err'};
  const stTxt={loading:'⟳ Carregando...',ok:'● Sincronizado',saving:'⟳ Salvando...',error:'✕ Erro'};
  const modal=modalOpen?'<div class="modal-overlay" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div class="modal-header"><h3>'+modalTitle+'</h3><button class="btn-icon" onclick="closeModal()">'+IC.x+'</button></div><div class="modal-body">'+modalHTML+'</div></div></div>':"";
  document.getElementById("app").innerHTML=ov
    +'<aside class="'+sCls+'"><div class="sidebar-header"><img src="'+LOGO+'" alt="Farmácia Luz"></div><nav class="sidebar-nav">'+NAV.map(n=>'<button class="nav-btn'+(page===n.key?" active":"")+'" onclick="navigate(\''+n.key+'\')">'+n.icon+'<span>'+n.label+'</span></button>').join("")+'</nav><div class="sidebar-footer"><button class="btn-foot" onclick="exportarDados()">💾 Exportar Backup</button><button class="btn-foot" onclick="recarregar()">'+IC.refresh+' Atualizar</button><button class="btn-foot" onclick="resetData()">Resetar Exemplo</button></div></aside>'
    +'<div class="main"><header class="topbar"><button class="menu-btn" onclick="toggleSide()">'+IC.menu+'</button><span class="topbar-icon">'+cur.icon+'</span><h2>'+cur.label+'</h2><span id="sync-badge" class="'+(stMap[syncStatus]||stMap.error)+'">'+(stTxt[syncStatus]||stTxt.error)+'</span></header><div class="content">'+pc+'</div></div>'+modal+'<div id="toast"></div>';
}

// ═══════════════════════════════════════
// INIT — Abre instantâneo, sincroniza depois
// ═══════════════════════════════════════
let _cloudReady=false;

// Garante que todos os arrays existem (dados antigos podem não ter quilometragem)
function ensureStructure(d){
  if(!d)return d;
  if(!d.motoboys)d.motoboys=[];
  if(!d.abastecimentos)d.abastecimentos=[];
  if(!d.manutencoes)d.manutencoes=[];
  if(!d.entregas)d.entregas=[];
  if(!d.quilometragem)d.quilometragem=[];
  if(!d.postos){
    // Auto-popula com postos já usados nos abastecimentos existentes
    const set=new Set();d.abastecimentos.forEach(a=>{if(a.posto)set.add(a.posto)});
    d.postos=[...set];
  }
  return d;
}

// Helpers para formulário de abastecimento
function togglePostoOutro(){const s=document.getElementById("f_posto_sel");const w=document.getElementById("f_posto_outro_wrap");if(s&&w){w.style.display=s.value==="__outro"?"":"none"}}
function atualizaMotoAbast(){}

function localLoad(){try{const s=localStorage.getItem(STORAGE_KEY);if(s){const d=JSON.parse(s);if(d&&d.motoboys)return ensureStructure(d)}}catch(e){}return null}
function localSave(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}catch(e){}}

async function init(){
  data=ensureStructure(localLoad()||JSON.parse(JSON.stringify(DEFAULT)));
  syncStatus="loading";
  render();

  try{
    const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error("Timeout")),8000));
    const cloud=await Promise.race([cloudLoad(),timeout]);
    if(cloud&&cloud.motoboys){
      data=ensureStructure(cloud);
      localSave();
      syncStatus="ok";
    }else{
      syncStatus="error";
    }
  }catch(e){
    syncStatus="error";
    showToast("⚠ Offline — edições ficam locais até reconectar",4000);
  }
  // SEMPRE libera a trava após init — a proteção real é não sobrescrever com DEFAULT
  _cloudReady=true;
  render();
}

// Salva local + nuvem (aguarda nuvem completar)
async function saveData(){
  localSave();
  if(_cloudReady){await cloudSave()}
  render();
}

init();
window.addEventListener("resize",()=>render());
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
</script>
